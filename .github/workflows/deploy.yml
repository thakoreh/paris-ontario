name: Validate Paris Pulse
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  publisher-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard-library tests with mocked sources/database: never run the publisher.
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  resident-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Local deterministic preview only; no production URL, credentials or writes.
      - run: npm run test:e2e -- tests/e2e/flows.spec.ts tests/e2e/resident-guide.spec.ts tests/e2e/resident-usability.spec.ts tests/e2e/navigation-regressions.spec.ts tests/e2e/push.spec.ts tests/e2e/resident-dashboard.spec.ts tests/e2e/area-setup.spec.ts tests/e2e/community-submission.spec.ts tests/e2e/ui-pass.spec.ts tests/e2e/share.spec.ts tests/e2e/card-sharing.spec.ts tests/e2e/community-email.spec.ts tests/e2e/neighbourhood-coverage-empty.spec.ts tests/e2e/accessibility.spec.ts --project=desktop --project=mobile
      # Preserve successful preview screenshots before the second Playwright
      # invocation clears its output directory. No production/account data.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resident-neighbourhood-preview
          path: test-results/**/neighbourhood*.png
          if-no-files-found: warn
          retention-days: 7
      # Keep resident failure traces before the production status invocation
      # clears Playwright's output directory.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resident-neighbourhood-failures
          path: test-results/
          retention-days: 7
      # Next dev streaming can return 200 for not-found pages; verify real HTTP
      # semantics against the production standalone server, without test fixtures.
      - run: npm run test:e2e -- tests/e2e/route-status.spec.ts --project=desktop --project=mobile
        env:
          PLAYWRIGHT_PRODUCTION: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resident-route-status-failures
          path: test-results/
          retention-days: 7
